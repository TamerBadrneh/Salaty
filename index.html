<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صلاتي</title>

    <!-- Icon -->
    <link rel="icon" href="./assets/images/mosque.png" />

    <!-- Fonts -->
    <!-- 1. IBM Plex Sans Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CDNs -->
    <!-- 1. Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />

    <!-- Styles -->
    <style>
      body {
        direction: rtl !important;
        width: 75% !important;
        margin-inline: auto;
        background: linear-gradient(135deg, #e9e4f0 0%, #c7b8e0 100%);
        color: #2d2350;
      }

      header,
      footer {
        background: transparent;
        color: #2d2350;
      }

      .table-responsive {
        background: transparent;
      }

      .table {
        background-color: #fff !important;
        color: #2d2350 !important;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(68, 18, 111, 0.08);
        overflow: hidden;
      }

      .table th {
        background-color: #a084ca !important;
        color: #fff !important;
        font-weight: 600;
        border: none;
      }

      .table td {
        background-color: #f3f0fa !important;
        color: #2d2350 !important;
        border: none;
      }

      option {
        background-color: #fff;
        color: #2d2350;
      }

      .btn-primary {
        color: #fff !important;
        background-color: #a084ca !important;
        border-color: #a084ca !important;
        font-weight: 600;
        border-radius: 8px;
        transition: background 0.2s;
      }

      .btn-primary:hover,
      .btn-primary:focus,
      .btn.btn-primary:active,
      .btn.btn-primary.active {
        background-color: #5a189a !important;
        border-color: #5a189a !important;
        color: #fff !important;
      }
    </style>
  </head>

  <body>
    <main class="d-flex gap-5 flex-column">
      <!-- Hero -->
      <header class="container col-xxl-8 px-4">
        <div class="row flex-lg-row-reverse align-items-center g-5 py-5">
          <div class="col-10 col-sm-8 col-lg-6">
            <img
              src="./assets/images/mosque.png"
              class="d-block mx-lg-auto img-fluid"
              alt="Bootstrap Themes"
              width="180"
              height="180"
              loading="lazy"
            />
          </div>
          <div class="col-lg-6">
            <h1 class="display-5 fw-bold lh-1 mb-3">صلاتي</h1>
            <p class="lead">دليلك اليومي لمواقيت الصلاة بدقة وسهولة</p>
            <p class="lead">الساعة الان : <span id="clock"></span></p>
          </div>
        </div>
      </header>

      <!-- Form -->
      <form id="location-form" class="d-flex gap-3">
        <select id="select-input" class="form-select">
          <option value="عمّان" selected>عمّان</option>
          <option value="إربد">إربد</option>
          <option value="الزرقاء">الزرقاء</option>
          <option value="البلقاء">البلقاء</option>
          <option value="المفرق">المفرق</option>
          <option value="الكرك">الكرك</option>
          <option value="الطفيلة">الطفيلة</option>
          <option value="معان">معان</option>
          <option value="العقبة">العقبة</option>
          <option value="جرش">جرش</option>
          <option value="مادبا">مادبا</option>
          <option value="عجلون">عجلون</option>
        </select>
        <button class="btn btn-primary" type="submit">استعلام</button>
      </form>

      <!-- Results -->
      <section id="prayer-times" class="my-4">
        <div class="table-responsive">
          <table
            class="table table-bordered text-center align-middle"
            style="background-color: #44126f; color: white"
          >
            <thead>
              <tr>
                <th scope="col">الصلاة</th>
                <th scope="col">الموعد</th>
              </tr>
            </thead>
            <tbody id="prayer-times">
              <tr id="Fajr"></tr>
              <tr id="Sunrise"></tr>
              <tr id="Dhuhr"></tr>
              <tr id="Asr"></tr>
              <tr id="Maghrib"></tr>
              <tr id="Isha"></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Footer -->
      <footer class="text-center my-4">
        <p>&copy; 2025 تامر بدرانه، جميع الحقوق محفوظة.</p>
        <p class="text-dark">
          تم تطوير هذا التطبيق لتسهيل معرفة مواقيت الصلاة بدقة وسهولة، باستخدام
          أحدث التقنيات وواجهة برمجة التطبيقات Aladhan لجلب البيانات بشكل موثوق.
        </p>
      </footer>
    </main>
  </body>

  <!-- Scripts CDNs -->
  <!-- 1. Bootstrap -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"
  ></script>

  <!-- 2. JQuery -->
  <script
    src="https://code.jquery.com/jquery-3.7.1.slim.min.js"
    integrity="sha256-kmHvs0B+OpCW5GVHUNjv9rOmY0IvSIRcf7zGUDTDQM8="
    crossorigin="anonymous"
  ></script>

  <!-- 3. Axios.js -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- main -->
  <script src="./main.js"></script>
</html>
